[project]
name = "genai-image-app"
version = "0.1.0"
description = "Single-user browser app for image generation via the Google Gemini Batch API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "google-genai>=0.8",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
]

[tool.uv]
# uv manages the virtual environment automatically. See README.md for commands.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
